# Nightly binaries. The M1 Air never builds: it downloads these.
#  - push to main  -> rolling "nightly" pre-release: kantor-nightly-ARCH-{linux,macos}.tar.gz
#    (install.sh), Kantor-nightly-{x86_64,aarch64}.AppImage and Kantor-nightly-aarch64.dmg
#    (ad-hoc signed, not notarised: notarisation runs only in release.yml)
#  - workflow_dispatch on another branch -> the same builds as workflow artifacts only;
#    the nightly release is published from main only
# Versioned releases (tags v*) are built by release.yml.
# Nightly binaries are built with KANTOR_CHANNEL=nightly and KANTOR_BUILD=<UTC commit time>, so
# the in-app updater follows the nightly channel and orders nightlies of one version. The publish
# job writes update-nightly.json(.sig), signed with the `release` environment's
# UPDATE_SIGNING_KEY (Linux AppImages and tarballs only: the nightly macOS build is ad-hoc
# signed, and the updater installs only Developer ID builds on macOS).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      universal:
        description: "macOS: build the universal (arm64 + x86_64) app and DMG as release.yml does, unsigned"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.arch }}-${{ matrix.platform || 'linux' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, os: ubuntu-24.04-arm }
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: macos-15, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && inputs.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        run: ./scripts/ci-deps.sh
      - if: runner.os == 'macOS'
        run: brew install librsvg
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true
      - name: Nightly channel and build stamp
        run: |
          echo "KANTOR_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "KANTOR_BUILD=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - if: ${{ !(runner.os == 'macOS' && inputs.universal) }}
        run: cargo build --release -p kantor
      - name: Package
        id: pkg
        run: |
          tag=nightly
          platform="${{ matrix.platform || 'linux' }}"
          name="kantor-${tag}-${{ matrix.arch }}-${platform}"
          if [ "$platform" = macos ]; then
            # Unsigned (ad-hoc) DMG of this runner's arch; release.yml makes the universal,
            # notarised one.
            if [ "${{ inputs.universal }}" = true ]; then
              ./scripts/build-dmg.sh --name "Kantor-${tag}-universal" dist
              lipo -archs dist/Kantor.app/Contents/MacOS/kantor
              arch -x86_64 dist/Kantor.app/Contents/MacOS/kantor --version || echo "::warning::could not run the x86_64 slice"
              dmg="Kantor-${tag}-universal.dmg"
            else
              ./scripts/build-dmg.sh --binary target/release/kantor \
                --name "Kantor-${tag}-${{ matrix.arch }}" dist
              dmg="Kantor-${tag}-${{ matrix.arch }}.dmg"
            fi
            dist/Kantor.app/Contents/MacOS/kantor --version
            ./scripts/package-macos.sh dist/Kantor.app "dist/${name}"
            rm -rf dist/Kantor.app
            ( cd dist && shasum -a 256 "$dmg" > "$dmg.sha256" )
          else
            ./scripts/package.sh "target/release/kantor" "dist/${name}"
            appimage="Kantor-${tag}-${{ matrix.arch }}.AppImage"
            ./scripts/package-appimage.sh target/release/kantor "dist/${appimage}"
            ( cd dist && sha256sum "$appimage" > "$appimage.sha256" )
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz*
            dist/Kantor-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    # Publish whatever built: one platform failing shouldn't hold back the others.
    # Only from main: a manual run on a branch must not replace main's nightly.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # UPDATE_SIGNING_KEY for the nightly update manifest; only main and v* tags may use it.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update manifest (signed)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: no update-nightly.json this time"
            exit 0
          fi
          version="$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          # The same stamp the build jobs compiled in (KANTOR_BUILD).
          stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          assets=()
          for arch in x86_64 aarch64; do
            f="dist/Kantor-nightly-${arch}.AppImage"
            [ -f "$f" ] && assets+=("linux-${arch}-appimage=$f")
            f="dist/kantor-nightly-${arch}-linux.tar.gz"
            [ -f "$f" ] && assets+=("linux-${arch}-tarball=$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::no Linux builds: no update-nightly.json this time"
            exit 0
          fi
          mkdir -p manifest
          ./scripts/update-manifest.sh nightly "$version" "$stamp" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly" \
            manifest/update-nightly.json "${assets[@]}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          # Rolling nightly: move the tag to this commit and replace the assets.
          git tag -f nightly && git push -f origin nightly
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title "Nightly" \
              --notes "Rolling build of main. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh"
          fi
          gh release edit nightly --prerelease --target "$GITHUB_SHA" \
            --notes "Rolling build of main at ${GITHUB_SHA::7} ($(date -u +%F)). Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh"
          gh release upload nightly dist/* --clobber
          # The manifest last, once the assets it points at are in place.
          if [ -f manifest/update-nightly.json ]; then
            gh release upload nightly manifest/update-nightly.json manifest/update-nightly.json.sig --clobber
          fi
