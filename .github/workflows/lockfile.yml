# Keeps Cargo.lock in the repo without anyone running cargo locally.
# Runs when manifests change (or by hand) and commits the refreshed lockfile.
name: Lockfile

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml"]
  workflow_dispatch:
    inputs:
      update:
        description: "Run `cargo update` (bump all deps within semver)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies
        run: |
          if [ -f Cargo.lock ] && [ "${{ inputs.update }}" != "true" ]; then
            cargo metadata --format-version 1 >/dev/null   # minimal update for changed manifests
          else
            cargo generate-lockfile
          fi
      - name: Commit if changed
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then echo "Cargo.lock up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cargo.lock"
          git push
