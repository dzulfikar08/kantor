# Mac App Store build (cargo feature `app-store`; docs/app-store.md, scripts/build-mas.sh).
#
#  - push to main, pull requests touching the store build: `check` builds the sandboxed
#    bundle for arm64 only, unsigned, checks it for private API and starts it once, so the
#    store variant can't rot. The bundle is a workflow artifact.
#  - workflow_dispatch / v* tags: `store` builds the universal bundle, signs it with the
#    Apple Distribution identity and the Mac App Store profile, makes the .pkg and has App
#    Store Connect validate it. It uploads only when asked: the `upload` input of a manual
#    run, or for tags the repository variable MAS_UPLOAD_ON_TAG = true.
#
# Secrets (environment `release`): APPLE_DISTRIBUTION_P12_BASE64, APPLE_DISTRIBUTION_P12_PASSWORD,
# MAC_INSTALLER_P12_BASE64, MAC_INSTALLER_P12_PASSWORD, MAS_PROFILE_BASE64, ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_BASE64.
name: Mac App Store

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/kantor_sandbox/**"
      - "vendor/gpui-pre-macos/**"
      - "packaging/macos/**"
      - "scripts/build-mas.sh"
      - "scripts/macos-*.sh"
      - ".github/workflows/mas.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the signed .pkg to App Store Connect (otherwise only validate it)"
        type: boolean
        default: false

concurrency:
  group: mas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # OneDrive and Google Drive sign-in (docs/cloud-providers.md): repository
  # variables, compiled in; unset hides the providers in Cloud Accounts.
  KANTOR_MS_CLIENT_ID: ${{ vars.KANTOR_MS_CLIENT_ID }}
  KANTOR_GOOGLE_CLIENT_ID: ${{ vars.KANTOR_GOOGLE_CLIENT_ID }}
  KANTOR_GOOGLE_CLIENT_SECRET: ${{ secrets.KANTOR_GOOGLE_CLIENT_SECRET }}

jobs:
  check:
    name: store bundle (arm64, unsigned)
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install librsvg
      - uses: Swatinem/rust-cache@v2
        with:
          key: mas-check
          cache-on-failure: true
      - name: Build (release, --features app-store)
        run: cargo build --release --locked -p kantor --features app-store
      - name: Bundle, private API check, sandboxed ad-hoc signature
        env:
          MAS_SINGLE_ARCH: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-mas.sh bundle dist --binary target/release/kantor
      - name: Smoke test
        run: |
          set -euo pipefail
          bin=dist/Kantor.app/Contents/MacOS/kantor
          "$bin" --version
          # The command-line file tools are refused with a pointer to the download.
          if "$bin" convert a.docx b.pdf 2> err.txt; then echo "::error::convert ran"; exit 1; fi
          grep -q "Mac App Store version" err.txt
          plutil -extract ITSAppUsesNonExemptEncryption raw dist/Kantor.app/Contents/Info.plist
          codesign --display --entitlements - dist/Kantor.app
      - uses: actions/upload-artifact@v4
        with:
          name: kantor-mas-arm64-unsigned
          path: dist/Kantor-mas-*.zip
          if-no-files-found: error
          retention-days: 14

  store:
    name: store package (universal, signed)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 150
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install librsvg
      - uses: Swatinem/rust-cache@v2
        with:
          key: mas-universal
          cache-on-failure: true
      - name: Universal bundle
        run: ./scripts/build-mas.sh bundle dist
      - name: Signing keychain, profile and App Store Connect key
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: ./scripts/ci-keychain.sh setup-mas
      - name: Sign, package, validate or upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || (startsWith(github.ref, 'refs/tags/') && vars.MAS_UPLOAD_ON_TAG == 'true') }}
        run: |
          set -euo pipefail
          args=()
          [ "$UPLOAD" != true ] || args+=(--upload)
          ./scripts/build-mas.sh package dist/Kantor.app dist ${args[@]+"${args[@]}"}
      - name: Remove keychain, profile and key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: ./scripts/ci-keychain.sh cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: kantor-mas-pkg
          path: dist/Kantor-*.pkg
          if-no-files-found: error
          retention-days: 30
