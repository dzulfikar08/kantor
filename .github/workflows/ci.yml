name: CI

on:
  workflow_dispatch:

jobs:
  vba_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kantor_vba --example vba_build
      - uses: actions/upload-artifact@v4
        with:
          name: vba_build
          path: target/release/examples/vba_build
