[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
# Pre-1.0 GPUI pulls in a lot; review advisories rather than hard-failing on unmaintained crates.
unmaintained = "workspace"
yanked = "warn"
# zip 8.x (only via docx-rs 0.4.22, which requires ^8.6): these advisories are all about
# `ZipArchive::extract` / `ZipStreamReader::extract` writing entries to disk (symlinks,
# permissions). Neither Kantor nor docx-rs ever extracts: entries are read by name into
# memory and archives are written fresh. Our own code uses zip 9. Drop these when docx-rs
# moves to zip 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8 via docx-rs; extract() never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 via docx-rs; extract() never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 via docx-rs; extract() never called" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8 via docx-rs; extract() never called" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-or-later",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0",
  "0BSD", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6", "MIT-0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
