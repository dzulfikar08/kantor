[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dzulfikar08/kantor"
authors = ["Dzulfikar Ats Tsauri"]

[workspace.dependencies]
# UI: gpui-kit pins the matching GPUI release (published as gpui-pre-*) and re-exports it.
gpui-kit = "0.9"
ironcalc = "0.9.1"
ironcalc_base = "0.9.1"
# Read-only import of .ods / .xls / .xlsb (Kantor never writes these formats).
calamine = "~0.38.0"  # pinned: sheets_engine works around an XLS formula bug (import.rs)
encoding_rs = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
# Channels between the MCP socket threads and the GPUI main thread (already in GPUI's tree).
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
# Already in GPUI's tree; Slides builds rotated picture rasters with it.
image = { version = "0.25", default-features = false }
# Blocking HTTP: no async runtime, one small TLS stack (rustls + ring, Mozilla roots).
# Shared by kantor_ai and kantor_update.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Already linked through rustls: Ed25519 and SHA-256 for kantor_update.
ring = "0.17"
base64 = "0.22"
# Calendar arithmetic for kantor_numfmt (already in the tree through IronCalc).
chrono = { version = "0.4", default-features = false }

kantor_ai = { path = "crates/kantor_ai" }
kantor_core = { path = "crates/kantor_core" }
kantor_mem = { path = "crates/kantor_mem" }
kantor_numfmt = { path = "crates/kantor_numfmt" }
kantor_pdf = { path = "crates/kantor_pdf" }
kantor_theme = { path = "crates/kantor_theme" }
kantor_ui = { path = "crates/kantor_ui" }
kantor_update = { path = "crates/kantor_update" }
sheets_engine = { path = "crates/sheets_engine" }
sheets_ui = { path = "crates/sheets_ui" }
docs_engine = { path = "crates/docs_engine" }
docs_layout = { path = "crates/docs_layout" }
docs_pdf = { path = "crates/docs_pdf" }
docs_ui = { path = "crates/docs_ui" }
slides_engine = { path = "crates/slides_engine" }
slides_pdf = { path = "crates/slides_pdf" }
slides_scene = { path = "crates/slides_scene" }
slides_ui = { path = "crates/slides_ui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Keep debug builds light: GPUI's dependency tree with full debuginfo is huge.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
# Fat LTO + one codegen unit: 60.3 MB -> 51.0 MB on x86_64 Linux (2026-11-08),
# keeping the install under the 60 MB budget. Costs build time, not speed.
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# GPUI's wgpu renderer with Kantor's memory patches (see vendor/gpui-pre-wgpu/KANTOR_PATCHES.md).
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# IronCalc with fast lookups (see vendor/ironcalc_base/KANTOR_PATCHES.md).
ironcalc_base = { path = "vendor/ironcalc_base" }
