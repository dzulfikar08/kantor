[package]
name = "pdf_engine"
description = "Kantor PDF viewer engine: opening, rendering, text, outline and links of PDF files with hayro (no GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pure-Rust PDF reader and rasterizer (MIT/Apache, by krilla's author); see
# docs/decisions/0003-pdf-renderer.md. The embedded standard-14 fonts and CJK
# CMaps are needed for PDFs that don't embed their fonts.
hayro = { version = "0.9", default-features = true }
# Arabic presentation forms to plain letters in extracted text.
unicode-normalization = "0.1"
# Signatures: the object structure of signed revisions (also used by kantor_pdf).
lopdf = { version = "0.47", default-features = false }
# Signatures: digests, RSA and ECDSA checks (already in the tree through rustls).
ring.workspace = true
# Signatures: the operating system's trusted roots (already in the tree).
rustls-native-certs = "0.8"
# Signatures: optional online issuer/revocation checks, only when allowed.
ureq.workspace = true
# Signing: the PDF side (fields, appearances, incremental updates, DSS).
kantor_pdf.workspace = true
# Signing: decrypting PKCS #12 files (AES/3DES/RC2 in CBC mode; RustCrypto,
# MIT/Apache, pure Rust; aes and cbc are already in the tree).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
rc2 = "0.8"
# Signing: PKCS #11 tokens and the macOS/Windows certificate stores.
kantor_keystore.workspace = true

[dev-dependencies]

[lints]
workspace = true
