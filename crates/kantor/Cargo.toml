[package]
name = "kantor"
description = "A small, fast, native office suite for Linux, built on GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "kantor"

[features]
# The Mac App Store build: sandboxed, no self-update, no command-line file
# tools (docs/app-store.md). scripts/build-mas.sh builds it.
app-store = ["kantor_core/app-store", "gpui-pre-macos/mas"]

[dependencies]
anyhow.workspace = true
async-channel = "2"
# Local dates in conflict copy names.
chrono = { workspace = true, features = ["clock"] }
docs_engine.workspace = true
docs_pdf.workspace = true
docs_ui.workspace = true
env_logger.workspace = true
futures.workspace = true
gpui-kit.workspace = true
kantor_ai.workspace = true
kantor_cloud.workspace = true
kantor_core.workspace = true
# `kantor pdf emeterai` / `sign --provider` / `providers`.
kantor_esign.workspace = true
kantor_merge.workspace = true
# File access in the App Sandbox (store build; no-ops elsewhere).
kantor_sandbox.workspace = true
# Password-protected Office files (MCP open_document checks the password).
kantor_crypt.workspace = true
kantor_pdf.workspace = true
kantor_theme.workspace = true
kantor_ui.workspace = true
kantor_update.workspace = true
log.workspace = true
pdf_ui.workspace = true
# `kantor pdf verify`: the signature checker.
pdf_engine.workspace = true
serde_json.workspace = true
sheets_engine.workspace = true
sheets_pdf.workspace = true
sheets_ui.workspace = true
slides_engine.workspace = true
slides_pdf.workspace = true
slides_ui.workspace = true

[target.'cfg(unix)'.dependencies]
# SIGTERM/SIGINT/SIGHUP (logout, `kill`, Ctrl+C) quit like the Quit command:
# cloud locks are released (main.rs).
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI's macOS platform (vendor/gpui-pre-macos): its `mas` feature for the
# store build, and the open panel's start folder for "Grant File Access".
gpui-pre-macos = "0.3.11"

[target.'cfg(windows)'.dependencies]
# The MCP endpoint's token (ipc.rs); already linked through rustls.
ring.workspace = true

[build-dependencies]
# kantor.exe's icon (build.rs; Windows only, already in GPUI's tree there).
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
