[package]
name = "docs_engine"
description = "Kantor Docs document model, editing commands and .docx I/O (no GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
kantor_core.workspace = true
kantor_ooxml.workspace = true
kantor_metafile.workspace = true
# Password-protected .docx and .odt files.
kantor_crypt.workspace = true
# Default features pull in image decoding, which Docs doesn't need yet.
docx-rs = { version = "0.4.22", default-features = false }
# Same versions docx-rs uses, for the package scan (no duplicate crates).
zip.workspace = true
quick-xml = "0.41"
# Reading OpenDocument text (.odt) imports.
roxmltree.workspace = true
unicode-segmentation = "1"
log.workspace = true
# Field dates (DATE, CREATEDATE…); the clock is read by the caller.
chrono.workspace = true
# Code pages of imported .rtf files.
encoding_rs.workspace = true
tempfile.workspace = true
# Citation data in Zotero and Mendeley fields (CSL JSON); Mendeley Cite
# keeps it base64-encoded in content control tags.
serde_json.workspace = true
base64.workspace = true
# CSL formatting, reference imports (see docs/decisions/0007-citations.md).
kantor_cite.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
