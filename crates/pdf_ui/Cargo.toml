[package]
name = "pdf_ui"
description = "Kantor PDF viewer UI: continuous pages, zoom, thumbnails, bookmarks, search, selection and links (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# Results from the render and text threads to the UI.
async-channel = "2"
gpui-kit.workspace = true
image.workspace = true
kantor_core.workspace = true
kantor_ui.workspace = true
log.workspace = true
pdf_engine.workspace = true
# Page tools and saving: assemble, page numbers, watermark, split, compress.
kantor_pdf.workspace = true

# Typed signatures: a script font from the system, as outlines (both already
# in the tree through GPUI / usvg).
fontdb = "0.23"
ttf-parser = "0.25"
imagesize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
