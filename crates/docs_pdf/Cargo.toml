[package]
name = "docs_pdf"
description = "Kantor Docs model → layout bridge and PDF export with krilla (no GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Saving inside the App Sandbox (kantor_core::fsx).
kantor_core.workspace = true
kantor_metafile.workspace = true
anyhow.workspace = true
docs_engine.workspace = true
docs_layout.workspace = true
log.workspace = true
tempfile.workspace = true
# PDF writer (ADR 0001). No "simple-text": layout is parley's, krilla only
# embeds the glyphs it is given. "raster-images" embeds PNG/JPEG pictures.
# Floating shapes: DrawingML preset geometry and theme colours, as Slides.
slides_engine.workspace = true
# Charts in floating frames: Slides' chart model and layout.
slides_scene.workspace = true
roxmltree.workspace = true
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# Blurred shadows: their PNGs.
flate2 = "1"

[dev-dependencies]
# Equation tests (tests/equations.rs).
kantor_math.workspace = true
# Reads the test variable font's character map.
skrifa = "0.42"
kantor_ooxml.workspace = true
# Builds .docx fixtures.
zip.workspace = true
# Fixed dates for updating fields.
chrono.workspace = true

[lints]
workspace = true
