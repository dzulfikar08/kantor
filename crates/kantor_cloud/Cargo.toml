[package]
name = "kantor_cloud"
description = "Kantor cloud storage: a small blocking WebDAV client (PROPFIND, GET, conditional PUT, LOCK) with no GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
# Gzip'd PROPFIND replies (already in the tree through zip).
flate2 = "1"
log.workspace = true
# SHA-256 of working copies (already linked through rustls).
ring.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same blocking ureq + rustls stack as kantor_ai and kantor_update.
ureq.workspace = true
# Trust the OS certificate store too (organisations' own CAs), next to
# Mozilla's roots in DER form (see src/tls.rs).
rustls-native-certs = "0.8"
webpki-root-certs = "1"

[dev-dependencies]
anyhow.workspace = true
# The dav example opens downloaded bytes through the real engines.
docs_engine.workspace = true
sheets_engine.workspace = true
tempfile.workspace = true
# A throwaway CA and an HTTPS server for the custom-CA test.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
