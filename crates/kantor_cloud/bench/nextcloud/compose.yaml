# Nextcloud as its admin manual recommends for production: PHP-FPM behind
# nginx, PostgreSQL, Redis for the distributed cache and transactional file
# locking, APCu as the local cache (the image enables it), cron for
# background jobs, and an FPM pool sized for the load.
name: kspike-nc
services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes: [db:/var/lib/postgresql]
  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  app:
    image: nextcloud:35.0.2-fpm
    depends_on: [db, redis]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin-bench-pass
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 web toxiproxy"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 1G
      PHP_OPCACHE_MEMORY_CONSUMPTION: "256"
    volumes:
      - html:/var/www/html
      - ./fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-kantor-bench.conf:ro
      - ./opcache.ini:/usr/local/etc/php/conf.d/zz-kantor-bench.ini:ro
  cron:
    image: nextcloud:35.0.2-fpm
    depends_on: [app]
    entrypoint: /cron.sh
    volumes: [html:/var/www/html]
  web:
    image: nginx:1.30.6-alpine
    depends_on: [app]
    ports: ["127.0.0.1:18680:80"]
    volumes:
      - html:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
networks:
  default:
    name: kspike
    external: true
volumes:
  db:
  html:
