[package]
name = "kantor_pdf"
description = "PDF page tools for Kantor: merge, split, rotate, watermark, page numbers, images to PDF"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Saving inside the App Sandbox (kantor_core::fsx).
kantor_core.workspace = true
# Pure-Rust PDF object model (MIT). Default features (chrono, rayon) are not needed.
lopdf = { version = "0.47", default-features = false }
image = { workspace = true, features = ["png", "jpeg"] }
# Saving over a file safely (temporary file, then rename).
tempfile.workspace = true
# Batch files (JSON) and form values from CSV/JSON tables.
serde.workspace = true
serde_json.workspace = true
# Form values from a spreadsheet's first sheet (already in the tree through sheets_engine).
calamine.workspace = true

[lints]
workspace = true
