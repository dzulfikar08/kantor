[package]
name = "slides_scene"
description = "Kantor Slides display lists (no GPUI): paths, gradients, pictures and glyph runs per slide, for the screen and for PDF"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Region maps: Office's geography cache (base64, maybe compressed).
base64.workspace = true
flate2 = "1"
# Rgb and the font substitution table.
docs_engine.workspace = true
# Text bodies are laid out with the Docs engine (parley), as on screen.
docs_layout.workspace = true
log.workspace = true
# Number formats on axes and labels, shared with Sheets.
kantor_numfmt.workspace = true
# Chart parts (ChartML).
roxmltree.workspace = true
slides_engine.workspace = true
kantor_ooxml.workspace = true
# The fonts' vertical glyph forms (GSUB `vert` / `vrt2`); docs_layout's version.
skrifa = "0.42"

[lints]
workspace = true

[dev-dependencies]
zip.workspace = true
