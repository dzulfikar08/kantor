[package]
name = "kantor_mem"
description = "Kantor: give freed heap memory back to the operating system (no GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

# Not the workspace lints: those forbid unsafe code, and this crate is the one
# audited exception (one call into the C allocator per platform). `deny` lets
# exactly that function opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
